# ============================================================
# 个人量化研究系统 - 全局配置
# 对应计划文档: 个人炒股辅助本地应用_76077b1a.plan.md
# ============================================================

# ---------- 数据存储 ----------
storage:
  duckdb_path: "data/warehouse.duckdb"

# ---------- 数据抓取 ----------
ingestion:
  # 数据源优先级：新浪财经接口(sina)在当前网络环境下最稳定；
  # 东方财富(eastmoney)部分接口在存在本地代理/VPN时可能出现间歇性 502/连接重置，
  # 因此设为 fallback，仅在 sina 缺字段时按需启用。
  primary_source: sina
  fallback_source: eastmoney

  # 历史行情回补起始日期（近 10 年，覆盖多个牛熊周期，满足 Walk-Forward 验证的样本量要求）
  history_start_date: "20150101"

  # 复权方式：前复权，便于技术指标和收益率计算的连续性
  adjust: "qfq"

  retry:
    max_attempts: 5
    base_delay_seconds: 2.0
    max_delay_seconds: 60.0
    jitter_seconds: 1.0

  rate_limit:
    # 全局发车间隔（多线程共用一把限速器，不是每个工人各睡一遍）
    min_interval_seconds: 0.35
    max_interval_seconds: 0.8

  # 新浪/东财/巨潮 HTTP 工人数。Tushare 在代码里固定 workers=1（客户端非线程安全）。
  http_workers: 6

  tushare_rate_limit:
    min_interval_seconds: 0.35
    max_interval_seconds: 0.45

  # 每批次处理多少只股票后，写一次 checkpoint（支持断点续传）
  checkpoint_batch_size: 50

  # 数据更新引擎：并发 fetch + 有界队列 + 专用写线程（见 docs/ingestion-engine-requirements.md）
  pipeline:
    async_write: true
    # 默认 http_workers * 2；队列满时 fetch 阻塞，防止全量任务堆积 DataFrame
    # write_queue_depth: 12
    write_batch_size: 1

  reference_data:
    disclosure:
      # 巨潮失败时自动回退 Tushare disclosure_date（按报告期 end_date 一次全市场）
      prefer_tushare: false
      # 连续失败多少期后熔断，避免 E2E/夜间任务空转数小时
      consecutive_fail_abort: 6

# ---------- 股票池过滤 ----------
universe:
  exclude_st: false          # 数据层不过滤 ST，保留标记，交由策略层决定是否排除
  exclude_delisted: true      # 已确认退市的不再拉取新数据（历史数据仍保留）
  include_boards:
    - main                    # 沪深主板
    - gem                     # 创业板
    - star                    # 科创板
    - bse                     # 北交所

# ---------- 模型训练与生命周期（Phase 1+ 使用，先占位） ----------
model:
  retrain_cadence: weekly     # 已与用户确认：每周末重训
  registry_dir: "mlops/registry"

# ---------- Phase 5 模拟盘（验收口径见 docs/phase5-development.md） ----------
paper_trading:
  # 相对开盘价的简化滑点（bp）；UI 须标注非真实盘口
  slippage_bp: 10
  price_adjust: qfq
  risk_fraction: 0.01
  max_single_weight: 0.15
  min_cash_buffer: 0.10
  max_concurrent_positions: 3
  horizon_days: 20
  default_template_for_advice: live_prep_10k
  templates:
    practice_100k:
      initial_cash_cny: 100000.0
    live_prep_10k:
      initial_cash_cny: 10000.0

# ---------- LLM 解释层 ----------
# 默认通义千问（阿里云百炼 DashScope，OpenAI 兼容接口）。可改为 deepseek。
# 换 DeepSeek 不能让模型「知道今天」：双方都是聊天模型，没有实时日历。
# 「今天」由 explain_assistant 注入本机日期；新闻由 llm/news_fetch 即时抓取。
# 不开通义 extra_body.enable_search：兼容接口不返回搜索来源，会破坏翻译层边界。
llm:
  provider: dashscope
  api_key_env: "DASHSCOPE_API_KEY"
  model: qwen-plus
